<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กระทรวงภีมแห่งชาติ | ปฏิทิน 2569–2570</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f4f8;--surface:#ffffff;--ink:#0e1d3b;--muted:#5b6785;--line:#d9deea;
  --navy:#0e1d3b;--gold:#b8892b;--gold-soft:#f3e7c9;--sun:#b3261e;--sat:#2f4f9e;--holiday-bg:#fbe9e7;--today:#0e1d3b;--today-ink:#ffffff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1325;--surface:#111d36;--ink:#eaeef7;--muted:#9aa7c4;--line:#24365c;
    --navy:#050b18;--gold:#e0b65a;--gold-soft:#2b2a22;--sun:#ff8a80;--sat:#8fb0ff;--holiday-bg:#3a1f26;--today:#e0b65a;--today-ink:#0a1325;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1325;--surface:#111d36;--ink:#eaeef7;--muted:#9aa7c4;--line:#24365c;
  --navy:#050b18;--gold:#e0b65a;--gold-soft:#2b2a22;--sun:#ff8a80;--sat:#8fb0ff;--holiday-bg:#3a1f26;--today:#e0b65a;--today-ink:#0a1325;color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:20}
header{background:var(--navy);color:#f4ead0;text-align:center;padding:48px 20px 40px;border-bottom:4px solid var(--gold)}
.emblem{width:72px;height:72px;margin:0 auto 14px;display:block}
h1{font-family:"Noto Serif Thai",serif;font-weight:700;font-size:clamp(28px,6vw,48px);line-height:1.3;margin:0;letter-spacing:.01em}
header p{margin:8px 0 0;color:#c9bf9f;font-size:16px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 16px;overflow-x:auto;white-space:nowrap}
nav button{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 13px;border-radius:999px;cursor:pointer;flex:none}
nav button:hover,nav button:focus-visible{border-color:var(--gold);outline:2px solid var(--gold);outline-offset:1px}
nav .go{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:28px 16px 20px}
.year{font-family:"Noto Serif Thai",serif;font-size:22px;margin:30px 0 14px;display:flex;align-items:center;gap:14px;color:var(--gold)}
.year::after{content:"";flex:1;height:1px;background:var(--line)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.month h2{margin:0;padding:12px 16px;background:var(--navy);color:#f4ead0;font-family:"Noto Serif Thai",serif;font-size:19px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--gold)}
.month h2 small{font-family:"Sarabun",sans-serif;font-weight:400;font-size:13px;color:#c9bf9f}
.grid{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 10px 6px;gap:2px;text-align:center}
.dow{font-size:13px;font-weight:600;color:var(--muted);padding:4px 0}
.dow:first-child{color:var(--sun)}.dow:last-child{color:var(--sat)}
.d{font-size:16px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:50%;max-width:42px;width:100%;margin:0 auto}
.d.su{color:var(--sun)}.d.sa{color:var(--sat)}
.d.hol{background:var(--holiday-bg);color:var(--sun);font-weight:600}
.d.today{background:var(--today);color:var(--today-ink);font-weight:700}
.hl{list-style:none;margin:0;padding:6px 16px 14px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line)}
.hl li{display:flex;gap:10px;padding:2px 0}
.hl b{color:var(--sun);min-width:44px;font-weight:600}
.hl:empty{display:none}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 16px 36px}
</style>
</head>
<body>
<header>
  <svg class="emblem" viewBox="0 0 72 72" aria-hidden="true">
    <circle cx="36" cy="36" r="33" fill="none" stroke="#b8892b" stroke-width="2"/>
    <circle cx="36" cy="36" r="27" fill="none" stroke="#b8892b" stroke-width="1" opacity=".6"/>
    <path d="M36 12l5 12h13l-10.5 8 4 13L36 38l-11.500 7 4-13L18 24h13z" fill="#b8892b"/>
    <path d="M20 54h32M24 58h24" stroke="#b8892b" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <h1>กระทรวงภีมแห่งชาติ</h1>
  <p>ปฏิทินกลาง พฤศจิกายน 2569 – มิถุนายน 2570</p>
</header>
<nav id="nav" aria-label="เลือกเดือน"></nav>
<main id="main"></main>
<footer>วันหยุดที่แสดงเป็นวันที่ตายตัวเท่านั้น วันหยุดตามจันทรคติ (มาฆบูชา วิสาขบูชา ฯลฯ) ให้ตรวจสอบกับประกาศทางการอีกครั้ง</footer>
<script>
const MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const DOW=["อา","จ","อ","พ","พฤ","ศ","ส"];
const HOL={"2026-12":{5:"วันพ่อแห่งชาติ",7:"หยุดชดเชยวันพ่อ",10:"วันรัฐธรรมนูญ",31:"วันสิ้นปี"},
"2027-1":{1:"วันขึ้นปีใหม่"},"2027-4":{6:"วันจักรี",13:"วันสงกรานต์",14:"วันสงกรานต์",15:"วันสงกรานต์"},
"2027-5":{1:"วันแรงงานแห่งชาติ",4:"วันฉัตรมงคล"},"2027-6":{3:"วันเฉลิมพระชนมพรรษาพระราชินี"}};
HOL["2026-12"]={5:"วันพ่อแห่งชาติ",10:"วันรัฐธรรมนูญ",31:"วันสิ้นปี"};
const start=[2026,10],end=[2027,5];
const now=new Date(),ty=now.getFullYear(),tm=now.getMonth(),td=now.getDate();
const main=document.getElementById("main"),nav=document.getElementById("nav");
let y=start[0],m=start[1],lastYear=0;
function id(y,m){return "m-"+y+"-"+m}
while(y<end[0]||(y===end[0]&&m<=end[1])){
  if(y!==lastYear){
    const h=document.createElement("div");h.className="year";h.textContent="พ.ศ. "+(y+543);main.appendChild(h);
    const box=document.createElement("div");box.className="months";box.id="box"+y;main.appendChild(box);lastYear=y;
  }
  const sec=document.createElement("section");sec.className="month";sec.id=id(y,m);
  const hol=HOL[y+"-"+(m+1)]||{};
  let html='<h2>'+MONTHS[m]+'<small>พ.ศ. '+(y+543)+'</small></h2><div class="grid">';
  DOW.forEach(d=>html+='<div class="dow">'+d+'</div>');
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)html+='<div></div>';
  for(let d=1;d<=days;d++){
    const w=(first+d-1)%7;let c="d";
    if(w===0)c+=" su";if(w===6)c+=" sa";
    if(hol[d])c+=" hol";
    if(y===ty&&m===tm&&d===td)c+=" today";
    html+='<div class="'+c+'">'+d+'</div>';
  }
  html+='</div><ul class="hl">';
  Object.keys(hol).forEach(d=>html+='<li><b>'+d+' '+MONTHS[m].slice(0,3)+'</b>'+hol[d]+'</li>');
  html+='</ul>';
  sec.innerHTML=html;
  document.getElementById("box"+y).appendChild(sec);
  const b=document.createElement("button");b.textContent=MONTHS[m]+" "+String(y+543).slice(2);
  b.onclick=(yy=>mm=>()=>document.getElementById(id(yy,mm)).scrollIntoView({block:"start"}))(y)(m);
  nav.appendChild(b);
  m++;if(m>11){m=0;y++}
}
const inRange=(ty>start[0]||(ty===start[0]&&tm>=start[1]))&&(ty<end[0]||(ty===end[0]&&tm<=end[1]));
if(inRange){
  const g=document.createElement("button");g.className="go";g.textContent="วันนี้";
  g.onclick=()=>document.getElementById(id(ty,tm)).scrollIntoView({block:"start"});
  nav.insertBefore(g,nav.firstChild);
}
</script>
</body>
</html>
